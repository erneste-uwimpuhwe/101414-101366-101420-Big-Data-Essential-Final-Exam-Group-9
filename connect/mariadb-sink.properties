# JDBC sink: Kafka topic -> MariaDB. No manual copy step.
name=mariadb-trips-sink
connector.class=io.confluent.connect.jdbc.JdbcSinkConnector
tasks.max=1
topics=trip-events

connection.url=jdbc:mariadb://127.0.0.1:3306/ridehail?useSSL=false
connection.user=root
connection.password=

auto.create=true
auto.evolve=true
table.name.format=trips

# Upsert on trip_id makes this sink idempotent. That is what lets the rest of
# the pipeline run at-least-once without producing duplicate rows.
insert.mode=upsert
pk.mode=record_value
pk.fields=trip_id

batch.size=500

# The console-producer test messages ("hello one" etc.) have no schema and
# will fail conversion. Skip them instead of halting the connector, and log
# what was skipped.
errors.tolerance=all
errors.log.enable=true
errors.log.include.messages=true