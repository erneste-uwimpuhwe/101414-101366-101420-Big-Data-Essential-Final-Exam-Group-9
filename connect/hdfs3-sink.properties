# HDFS 3 sink: Kafka topic -> HDFS, Parquet, partitioned by date.
name=hdfs3-trips-sink
connector.class=io.confluent.connect.hdfs3.Hdfs3SinkConnector
tasks.max=1
topics=trip-events

hdfs.url=hdfs://localhost:9000

# Output path becomes:
#   /data/trip-events/dt=YYYY-MM-dd/trip-events+<partition>+<start>+<end>.parquet
# The Kafka partition and offset range are in every filename. That is how the
# connector achieves exactly-once delivery to HDFS: on restart it reads the
# write-ahead log in logs.dir and redoes only the incomplete file.
topics.dir=/data
logs.dir=/logs

format.class=io.confluent.connect.hdfs3.parquet.ParquetFormat

# A file closes when EITHER 200 records accumulate OR 60 seconds pass. Both
# deliberately small so files appear while examiners watch. In production
# these would be far larger - many small files waste NameNode memory, which
# is the classic HDFS anti-pattern.
flush.size=200
rotate.interval.ms=60000

partitioner.class=io.confluent.connect.storage.partitioner.TimeBasedPartitioner
partition.duration.ms=86400000
path.format='dt'=YYYY-MM-dd
locale=en-US
timezone=UTC

# Wallclock, NOT RecordField. Our event_ts is an ISO string; the RecordField
# extractor requires an int64 or a Timestamp logical type and throws on
# strings. Wallclock uses the connector's clock, fine for live ingestion.
timestamp.extractor=Wallclock

errors.tolerance=all
errors.log.enable=true
confluent.topic.bootstrap.servers=localhost:9092
confluent.topic.replication.factor=1
confluent.license=