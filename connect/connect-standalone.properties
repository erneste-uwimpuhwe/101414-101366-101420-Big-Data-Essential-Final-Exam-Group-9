# Kafka Connect standalone worker. Runs BOTH sinks in one process.
#
# JsonConverter with schemas.enable=true is required: the producer publishes
# a {"schema":..., "payload":...} envelope. The JDBC sink needs the schema to
# create the MariaDB table, and the Parquet writer needs it to build an Avro
# schema. With schemas.enable=false both sinks reject every record.

bootstrap.servers=localhost:9092

key.converter=org.apache.kafka.connect.storage.StringConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true

offset.storage.file.filename=D:/kafka-connect/connect.offsets
offset.flush.interval.ms=10000

plugin.path=D:/kafka-connect/plugins